[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pidbox"
version = "0.1.0"
description = "pidbox package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"numpy>=1.24",
	"pandas>=2.0",
	"matplotlib>=3.7",
	"statsmodels>=0.14",
	"pyarrow>=14.0",
	"mcp>=1.6.0",
]

[project.scripts]
pidbox = "pidbox.cli:main"
